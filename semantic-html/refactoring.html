<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refactoring</title>
</head>
<body>

<header>
  <p><a href="index.html">Главная</a></p>
</header>

<main id="main-content">
  <h1>Поддержка</h1>

  <section aria-labelledby="search-heading">
    <h2 id="search-heading">Поиск обращения</h2>

    <form role="search" action="#" method="get">
      <label for="ticket-search">Номер обращения</label>
      <input id="ticket-search" name="ticketNumber" type="text" placeholder="Например, 101">
      <button type="submit">Найти</button>
    </form>
  </section>


  <fieldset>
    <legend>Способ связи</legend>
    <label><input type="radio" name="contactMethod" value="email" checked> Email</label>
    <label><input type="radio" name="contactMethod" value="phone"> Телефон</label>
    <label><input type="radio" name="contactMethod" value="messenger"> Мессенджер</label>
  </fieldset>

  <div>
    <label for="contact-value">Контакт для связи</label>
    <input id="contact-value" name="contactValue" type="text" autocomplete="tel">
  </div>

  <div>
    <label for="title">Тема обращения</label>
    <input id="title" name="title" type="text" required aria-describedby="title-hint">
    <p id="title-hint">Кратко опишите суть проблемы одним предложением</p>
  </div>

  <img src="assets/images/support.png" alt="" width="28" height="28">
</main>
<footer>
  <section aria-labelledby="contacts-heading">
    <h2 id="contacts-heading">Контакты поддержки</h2>

    <ul>
      <li>
        <span>Телефон:</span>
        <a href="tel:+78005553535">+7 800 555-35-35</a>
      </li>
      <li>
        <span>Email:</span>
        <a href="mailto:support@helpdesk.local">pomogite@pomosh.sos</a>
      </li>
      <li>
        <span>Время работы:</span>
        Пн–Пт, 12:00–16:00 (МСК)
      </li>
    </ul>
  </section>
</footer>
</body>
</html>
